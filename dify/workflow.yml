          type: no-auth
        body:
          data:
          - id: key-value-100
            key: ''
            type: text
            value: '{"title": "碎锚酒馆 · {{#prep.player_key#}}", "summary": "碎锚酒馆老板老巴恩的恩怨账本，记录玩家 {{#prep.player_key#}} 在此留下的每一笔恶作剧、欠账与人情。", "idempotency_key": "grudge-inn-{{#prep.player_key#}}"}'
          type: json
        default_value:
        - key: body
          type: string
          value: '{}'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: '{}'
        desc: 幂等创建或获取玩家专属 PowerContext Scope；同名玩家在不同会话中固定命中同一个 Scope
        error_strategy: default-value
        headers: ''
