    - data:
        desc: 玩家名号是跨会话翻旧账的唯一标识；留空则自动用 Dify 会话用户 ID 兜底。
        selected: false
        title: 报上名号
        type: start
        variables:
        - label: 玩家ID（跨会话翻旧账靠它识别你，留空则用 guest）
          max_length: 64
          options: []
          required: false
          type: text-input
          variable: player_id
      height: 110
      id: start
      position:
        x: 80
        y: 300
      positionAbsolute:
        x: 80
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json
          import re


          def main(player_id: str, user_id: str, utterance: str) -> dict:
              raw = (player_id or "").strip()
              if not raw:
                  user = (user_id or "").strip()
                  raw = "dx-" + user[:8] if user else "guest"
              key = re.sub(r"[^0-9A-Za-z_\u4e00-\u9fff-]", "-", raw)[:48] or "guest"
              said = (utterance or "").strip() or "（冒险者沉默不语）"
              return {
                  "player_key": key,
                  "query_json": json.dumps(said, ensure_ascii=False),
                  "reason_json": json.dumps("玩家原话：" + said, ensure_ascii=False),
              }
        code_language: python3
        desc: 规范化玩家ID（留空则用 Dify 会话用户兜底），并把本回合原话转成可直接拼进 JSON 的安全字面量
        outputs:
          player_key:
            children: null
            type: string
          query_json:
            children: null
            type: string
          reason_json:
            children: null
            type: string
        selected: false
        title: 身份与话术整理
        type: code
        variables:
        - value_selector:
          - start
          - player_id
          value_type: string
          variable: player_id
        - value_selector:
          - sys
          - user_id
          value_type: string
          variable: user_id
        - value_selector:
          - sys
          - query
          value_type: string
          variable: utterance
