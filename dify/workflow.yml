app:
  description: 碎锚酒馆里，独眼老板老巴恩会把你做过的每件恶作剧、欠账与恩情记进《碎锚恩怨账本》（PowerContext + seekdb 持久化）；换个新会话再来，只要报同一个名号，他照样一笔一笔翻旧账。
  icon: 🍺
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 碎锚酒馆 · 记仇老板老巴恩
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext HTTP 服务地址。Dify 跑在 Docker 容器里时改成 http://host.docker.internal:8000
    id: 2c7c9f0e-3a51-4f0e-9d3a-6f1a1f3f7a10
    name: pc_base_url
    selector:
    - env
    - pc_base_url
    value: http://127.0.0.1:8000
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 50
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |
      ⚓ 海雾裹着咸腥味灌进碎锚酒馆，吧台上的鲸油灯晃了三晃。

      独眼老板老巴恩用缺了口的铁钩敲了敲橡木酒桶，翻开手边那本浸透朗姆酒渍的《碎锚恩怨账本》：
      “生面孔？还是改头换面来赖账的？先报个名号——在这间酒馆里，你倒进酒桶的每一撮粗盐、欠下的每一枚铜板、帮过的每一次忙，老子都记在账上。”

      🍺 玩法：在「玩家ID」里填一个名字（例如 `cui` 或 `shen`，留空则自动用会话身份兜底），然后在对话里自由恶作剧、赖账、赔礼道歉或打听传闻。你做的每件事都会写进 PowerContext 账本；哪怕关闭页面、开启全新会话，只要报同一个名号，老巴恩第一句话就会翻你的旧账！
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我往你的橡木麦酒桶里倒了一把粗盐，一文钱也不赔，你能拿我怎样？
    - 上次往麦酒桶倒粗盐是我混账，今天拎来三坛陈年朗姆酒赔罪，酒钱双倍奉上。
    - 老巴恩，你这碎锚酒馆开了多少年了？今晚码头有什么传闻？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
