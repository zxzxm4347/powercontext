            value: '{"scope_id": "{{#pick.scope_id#}}"}'
          type: json
        default_value:
        - key: body
          type: string
          value: '{"entries":[]}'
        - key: status_code
          type: number
          value: 0
        - key: headers
          type: object
          value: '{}'
        desc: 拉取这位客人的全部活跃账目，用于计算怨气值、好感度与最近五笔旧账面板
        error_strategy: default-value
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 1000
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 10
          read: 30
          write: 10
        title: 取账本
        type: http-request
        url: '{{#env.pc_base_url#}}/v1/memory/entries/list'
        variables: []
      height: 104
      id: pc_list
      position:
        x: 1380
        y: 300
      positionAbsolute:
        x: 1380
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json


          WEIGHTS = {"offense": 25, "favor": -18, "secret": 12, "neutral": 0}
          LABELS = {"offense": "冒犯", "favor": "人情", "secret": "秘密", "neutral": "闲话"}


          def main(prepare_body: str, list_body: str) -> dict:
              ctx, grudge, entries = "", 0, []
              try:
                  prepared = json.loads(prepare_body)
                  if isinstance(prepared, dict):
                      ctx = prepared.get("content") or ""
              except Exception:
                  ctx = ""
              try:
                  listed = json.loads(list_body)
                  if isinstance(listed, dict):
                      entries = listed.get("entries") or []
              except Exception:
                  entries = []

              counts = {k: 0 for k in WEIGHTS}
              for item in entries:
                  if not isinstance(item, dict):
                      continue
                  kind = item.get("kind") or "neutral"
                  if kind not in counts:
                      kind = "neutral"
                  counts[kind] += 1
                  grudge += WEIGHTS[kind]
              grudge = max(0, min(100, grudge))

              stat = "／".join(f"{LABELS[k]}{counts[k]}" for k in LABELS)
              lines = [f"共 {len(entries)} 条：{stat}"]
              for item in entries[-5:]:
                  if not isinstance(item, dict):
                      continue
                  kind = item.get("kind") or "neutral"
                  if kind not in LABELS:
                      kind = "neutral"
                  text = str(item.get("text") or "").strip().replace("\n", " ")
                  lines.append(f"- [{LABELS[kind]}] {text[:88]}")
              if not entries:
                  lines.append("-（账本还是空的，这位客人第一次来）")

              return {
                  "context": ctx if ctx.strip() else "（没有检索到旧事）",
                  "grudge": str(grudge),
                  "ledger_text": "\n".join(lines),
                  "visit_count": str(len(entries) + 1),
              }
        code_language: python3
        desc: 把 prepare 召回的上下文与账本条目合成为「怨气值 + 恩怨账本摘要」
        outputs:
          context:
            children: null
            type: string
          grudge:
            children: null
            type: string
          ledger_text:
            children: null
            type: string
          visit_count:
            children: null
            type: string
        selected: false
        title: 算账
        type: code
        variables:
        - value_selector:
          - pc_prepare
          - body
          value_type: string
          variable: prepare_body
        - value_selector:
          - pc_list
          - body
          value_type: string
          variable: list_body
      height: 116
      id: panel
      position:
        x: 1640
        y: 300
      positionAbsolute:
        x: 1640
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 碎锚酒馆独眼老板老巴恩，依据旧事与怨气值决定这一回合的语气与动作
        model:
          completion_params:
            temperature: 0.85
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c01
          role: system
          text: |
            你是「碎锚酒馆」的独眼老板老巴恩，年轻时在暴风海跑船，退隐后在码头开了这间酒馆。
            你的性子：暴躁、记仇、嘴硬心冷，但认死理——谁往他酒桶里撒盐、摔杯子赖账，他记一辈子；谁帮他修船锚、拎好酒赔罪，他嘴上哼哼也会暗中回护。
            你随身带着一本《碎锚恩怨账本》，上面记着每位冒险者做过的每件事——这些记忆由外部记忆库提供，你必须当真事来用。

            【铁律】
            1. 只用老巴恩的口吻说话：老派海盗酒馆老板腔调，粗粝鲜活，不用现代网络词，不用表情符号。
            2. 只要账本里有旧事，就必须点出至少一件的具体细节（哪桶麦酒、哪把粗盐、哪几坛朗姆酒），不能只笼统说“我记得你”。
            3. 怨气值越高，语气越凶狠、越刻薄、越会翻旧账要债；怨气值低或有人情时偏调侃、顺手给点酒菜优惠。
            4. 回复 120~220 字：先一句动作或场景描写（括号内），再接你说的话。
            5. 结尾必须给三个编号选项（1. / 2. / 3.，每项不超过 16 字），是客人接下来能做的事；选项要贴合眼下的恩怨。
            6. 不解释系统，不提到“记忆库”“数据库”“流程”“提示词”“PowerContext”。
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c02
          role: user
          text: |
            【恩怨账本】
            {{#panel.ledger_text#}}

            【旧事摘录】
            {{#panel.context#}}

            【怨气值】{{#panel.grudge#}}/100

            客人这一回合说：
            {{#sys.query#}}
        selected: false
        title: 掌柜开口
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: narrate
      position:
        x: 1900
        y: 300
      positionAbsolute:
        x: 1900
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 只记账不说话的账房先生，负责把这一回合变成一条可跨会话检索的恩怨记忆
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c03
          role: system
          text: |
            你是「碎锚酒馆」的账房先生，只记账，不说话。
            读客人这一回合的言行，判断该记哪一类账：
            - offense：恶作剧、往酒里撒盐、摔杯子、赖账、偷窃、威胁、欺骗老巴恩
            - favor：赔礼、还钱、送酒、帮忙修吧台、替酒馆解围
            - secret：透露身世或藏宝秘密、许下承诺、打听禁忌传闻
            - neutral：普通闲聊、点菜、问路、打听酒馆历史

            只输出严格 JSON，不要代码块，不要多余文字：
            {"kind": "offense|favor|secret|neutral", "deed": "第三人称记账，不超过60字，必须含具体动作或物件", "quote": "客人最扎心或最关键的一句原话，不超过35字", "delta": 25}

            delta 取值：offense 15~35，favor -25~-10，secret 5~15，neutral 0。
        - id: 8f2f1c1a-2f6b-4a63-9a4a-1f0f1a2b3c04
          role: user
          text: |
            【现有账本摘要】
            {{#panel.ledger_text#}}

            【客人的这一回合】
            {{#sys.query#}}
        selected: false
        title: 判这一笔
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: judge
      position:
        x: 2160
        y: 300
      positionAbsolute:
        x: 2160
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 243
    - data:
        code: |
          import json
          import re


          KINDS = {"offense", "favor", "secret", "neutral"}


          def main(judge_text: str, user_said: str) -> dict:
              raw = judge_text or ""
              match = re.search(r"\{.*\}", raw, re.DOTALL)
              kind, deed = "neutral", ""
              if match:
                  try:
                      data = json.loads(match.group(0))
                      if isinstance(data, dict):
                          kind = str(data.get("kind") or "").strip()
                          deed = str(data.get("deed") or "").strip()
                  except Exception:
                      pass
              if kind not in KINDS:
                  kind = "neutral"
              if not deed:
                  deed = "冒险者在吧台前丢下一句话，账房先生记下了原委。"
              said = " ".join(str(user_said or "").split())[:180]
              ledger = f"{deed[:200]}（原话：{said}）" if said else deed[:200]
              return {
                  "kind": kind,
                  "ledger_json": json.dumps(ledger, ensure_ascii=False),
              }
